---
name: Lint

"on":
  push: { }
  pull_request: { }

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint
        run: >
               # --no-run-if-empty prevents shellcheck from erroring when no .sh files exist
               find. -name "*.sh" -print0 |
               xargs -0 --no-run-if-empty shellcheck
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint .
