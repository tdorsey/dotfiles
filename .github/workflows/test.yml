---
name: Test

on:
  push: {}
  pull_request: {}

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bats and helpers
        run: |
          sudo apt-get install -y bats
          git submodule update --init --recursive

      - name: Run tests
        run: bats tests/
